# TRMNL recipe form — NYC transit board
#
# Paste the body of this file into the plugin's "Custom Fields" box, after
# replacing REPLACE_ME with the deployed Worker's hostname.
#
# Layout is a fixed 3x2 grid: three columns, at most two cards each. Three is
# the last column count at which a destination stays readable — at four, a
# subway destination gets about one character. Slots map to the grid in order:
#
#   Card 1 | Card 3 | Card 5      (top row)
#   Card 2 | Card 4 | Card 6      (bottom row)
#
# A slot left Off is omitted and its column-mate fills the column, doubling
# that card's rows.

- keyname: card1_visible
  field_type: boolean
  name: Show this card
  description: Hide a card without losing its settings
  group: Column 1 · Row 1
  optional: true
  default: true
  help_text: >-
    Its column-mate then fills the column and shows twice as many departures.

- keyname: card1_station
  field_type: xhrSelectSearch
  name: Station or stop
  description: Type part of a name, then pick from the list
  group: Column 1 · Row 1
  optional: true
  endpoint: https://REPLACE_ME.workers.dev/api/stations?slot=1
  http_verb: GET
  help_text: >-
    A station complex is listed once and covers every platform. A bus corner
    is listed once and covers both sides of the street.

- keyname: card1_routes
  field_type: string
  name: Routes
  description: Leave blank for everything that stops here
  group: Column 1 · Row 1
  optional: true
  placeholder: 1,2,3
  help_text: >-
    Comma separated, written the way you say them: subway lines (1,2,3 or
    A,C,E), railroad branches (Hudson), bus routes (M42). Case and partial
    names work, so "hud" finds Hudson. Most useful at a complex like Times
    Square, where a card would otherwise carry twelve lines.

- keyname: card1_direction
  field_type: select
  name: Direction
  description: Both, or give one direction the whole card
  group: Column 1 · Row 1
  optional: true
  options:
    - Both directions: ""
    - First column only: "1"
    - Second column only: "2"
  default: ""
  help_text: >-
    The headings on the card name where each column goes — Uptown, Downtown,
    Flushing-Main St. Pick the one you ride. On a railroad the first column is
    city-bound; at a terminal like Grand Central it is empty.

- keyname: card1_walk
  field_type: number
  name: Walk time (minutes)
  description: Departures you could not reach in this time are hidden
  group: Column 1 · Row 1
  optional: true
  default: 5
  placeholder: 5

- keyname: card1_title
  field_type: string
  name: Card heading
  description: Leave blank to use the station name
  group: Column 1 · Row 1
  optional: true
  placeholder: Station name

