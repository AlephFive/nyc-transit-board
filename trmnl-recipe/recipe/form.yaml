- keyname: use_24_hour
  field_type: boolean
  name: 24-hour clock
  description: 16:45 rather than 4:45 PM
  group: Display
  optional: true
  default: true

- keyname: urgent_threshold
  field_type: number
  name: Highlight departures within (minutes)
  description: Counted from when you would need to leave
  group: Display
  optional: true
  default: 5
  placeholder: 5
  help_text: >-
    Highlighted rows are drawn white on black. Lower this if most of the board
    ends up highlighted — once half the rows are marked, nothing stands out.

- keyname: destination_scale
  field_type: select
  name: Destination text size
  description: Smaller fits more of a long station name
  group: Display
  optional: true
  options:
    - Smallest: "0.8"
    - Smaller: "0.9"
    - Normal: "1"
    - Larger: "1.1"
    - Largest: "1.2"
  default: "1"
  help_text: >-
    Sets the size of the destination on every row. Smaller fits more of a long
    name before it clips; larger reads better from a distance.
